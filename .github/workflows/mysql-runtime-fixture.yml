name: Disposable preinstalled MySQL fixture
on:
  push:
    branches: ['codex/php-runtime-fixture-20261022']
    paths: ['.github/workflows/mysql-runtime-fixture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Package preinstalled MySQL without downloading packages
        shell: bash
        run: |
          set -euo pipefail
          command -v mysqld
          mysqld --version
          mkdir -p fixture-mysql/bin fixture-mysql/lib fixture-mysql/data
          cp "$(readlink -f "$(command -v mysqld)")" fixture-mysql/bin/
          cp "$(readlink -f "$(command -v mysql)")" fixture-mysql/bin/
          mysqld --no-defaults --initialize-insecure --user="$(id -un)" --datadir="$PWD/fixture-mysql/data" --log-error="$PWD/fixture-mysql/init.log"
          for target in fixture-mysql/bin/*; do
            ldd "$target" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'
          done | sort -u > /tmp/mysql-libraries.txt
          while IFS= read -r library; do cp -L "$library" fixture-mysql/lib/; done < /tmp/mysql-libraries.txt
          cat > fixture-mysql/server <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/lib/ld-linux-x86-64.so.2" --library-path "$HERE/lib" "$HERE/bin/mysqld" --no-defaults "$@"
          SH
          cat > fixture-mysql/client <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/lib/ld-linux-x86-64.so.2" --library-path "$HERE/lib" "$HERE/bin/mysql" --no-defaults "$@"
          SH
          chmod 755 fixture-mysql/server fixture-mysql/client
          fixture-mysql/server --version
          tar -czf mysql-runtime-fixture.tar.gz fixture-mysql
          sha256sum mysql-runtime-fixture.tar.gz > mysql-runtime-fixture.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-runtime-fixture
          path: |
            mysql-runtime-fixture.tar.gz
            mysql-runtime-fixture.sha256
          retention-days: 1
