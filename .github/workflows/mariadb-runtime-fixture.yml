name: Disposable MariaDB runtime fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install MariaDB fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-server mariadb-client
      - name: Package empty isolated database runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture-mariadb/bin fixture-mariadb/lib fixture-mariadb/data
          cp /usr/sbin/mariadbd fixture-mariadb/bin/
          cp /usr/bin/mariadb fixture-mariadb/bin/
          sudo mariadb-install-db --no-defaults --datadir="$PWD/fixture-mariadb/data" --auth-root-authentication-method=normal --skip-test-db --user="$(id -un)"
          for target in fixture-mariadb/bin/*; do
            ldd "$target" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'
          done | sort -u > /tmp/mariadb-libraries.txt
          while IFS= read -r library; do cp -L "$library" fixture-mariadb/lib/; done < /tmp/mariadb-libraries.txt
          cat > fixture-mariadb/server <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/lib/ld-linux-x86-64.so.2" --library-path "$HERE/lib" "$HERE/bin/mariadbd" --no-defaults "$@"
          SH
          cat > fixture-mariadb/client <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/lib/ld-linux-x86-64.so.2" --library-path "$HERE/lib" "$HERE/bin/mariadb" --no-defaults "$@"
          SH
          chmod 755 fixture-mariadb/server fixture-mariadb/client
          fixture-mariadb/server --version
          tar -czf mariadb-runtime-fixture.tar.gz fixture-mariadb
          sha256sum mariadb-runtime-fixture.tar.gz > mariadb-runtime-fixture.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mariadb-runtime-fixture
          path: |
            mariadb-runtime-fixture.tar.gz
            mariadb-runtime-fixture.sha256
          retention-days: 1
