name: Disposable PHP runtime fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install PHP CLI and test extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-curl php8.3-mbstring php8.3-xml
          php8.3 -v
          php8.3 -m
      - name: Package standalone runner fixture without repository contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/bin fixture/lib fixture/ext
          cp "$(readlink -f "$(command -v php8.3)")" fixture/bin/php
          extension_dir="$(php8.3 -r 'echo ini_get("extension_dir");')"
          cp "$extension_dir/"*.so fixture/ext/
          for conf in /etc/php/8.3/cli/conf.d/*.ini; do
            cat "$conf" >> fixture/php.ini
            printf '\n' >> fixture/php.ini
          done
          printf 'display_errors=1\nerror_reporting=E_ALL\nzend.exception_ignore_args=1\n' >> fixture/php.ini
          for target in fixture/bin/php fixture/ext/*.so; do
            ldd "$target" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'
          done | sort -u > /tmp/fixture-libraries.txt
          while IFS= read -r library; do cp -L "$library" fixture/lib/; done < /tmp/fixture-libraries.txt
          cat > fixture/php <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          export PHP_INI_SCAN_DIR=""
          exec "$HERE/lib/ld-linux-x86-64.so.2" --library-path "$HERE/lib" "$HERE/bin/php" -c "$HERE/php.ini" -d "extension_dir=$HERE/ext" "$@"
          SH
          chmod 755 fixture/php
          fixture/php -v
          fixture/php -r '$d=new PDO("sqlite::memory:"); $d->exec("CREATE TABLE fixture (id INTEGER)"); echo "SQLITE FIXTURE OK\n";'
          tar -czf php-runtime-fixture.tar.gz fixture
          sha256sum php-runtime-fixture.tar.gz > php-runtime-fixture.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: php-runtime-fixture
          path: |
            php-runtime-fixture.tar.gz
            php-runtime-fixture.sha256
          retention-days: 1
